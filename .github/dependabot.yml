version: 2
updates:
  # bl new clones main in production and develop in dev, so keep both branches current.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      # The Blaxel SDK gets its own weekly PR so it never falls behind.
      blaxel-sdk:
        patterns:
          - "blaxel"
      # Everything else is batched into one weekly PR for minor and patch releases.
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "blaxel"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      # The Blaxel SDK gets its own weekly PR so it never falls behind.
      blaxel-sdk:
        patterns:
          - "blaxel"
      # Everything else is batched into one weekly PR for minor and patch releases.
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "blaxel"
        update-types:
          - "minor"
          - "patch"
